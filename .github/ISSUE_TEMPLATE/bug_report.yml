name: Bug report
description: Something the bot does doesn't work as it should
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead? A screenshot of the bot's message helps.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The command and its options (or the button pressed), the channel, and when it happened.
    validations:
      required: true
