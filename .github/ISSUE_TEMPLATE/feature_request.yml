name: Feature / idea
description: Suggest a command or feature for the bot
labels: ["enhancement"]
body:
  - type: textarea
    id: idea
    attributes:
      label: What's the idea?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why?
      description: What problem does it solve, or who is it for (players, staff, tournament hosts)?
