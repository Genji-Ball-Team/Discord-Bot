name = "genjiball-discord-bot"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Every minute: tournament confirm DMs and lists. Every TOURNEY_REFRESH_MINUTES: the site's new or
# changed tourneys. Every LEADERBOARD_REFRESH_MINUTES: live leaderboards.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "genjiball-discord-bot"
database_id = "436cac8d-7325-44c7-9d83-cb22cbe17e86"

[vars]
# From the Discord Developer Portal, "General Information" page of your app.
DISCORD_APPLICATION_ID = "1556986418239115295"
DISCORD_PUBLIC_KEY = "8d2c76d55758fea1e5f5486946b95ca31783fda2c6348b5d6e3be643c1cab2e2"

# The Genji Ball server: npm run register puts the /gr commands here.
DISCORD_GUILD_ID = "1110543205482627102"

# The website the bot reads. It never changes it.
SITE_URL = "https://genjiball.us"

# Staff: members with this role (and server admins) can use everything but /gr stats.
# Right-click the role → Copy Role ID (needs Developer Mode on).
STAFF_ROLE_ID = "1199414765055901737"

# Where the site's tourneys get their sign-up post and list. Right-click the channel → Copy Channel ID.
# Empty: no tourney posts.
TOURNEY_CHANNEL_ID = "1548176545770901514"

# Where tournament match results (wins, kills, rating changes) are posted. Empty: none.
RESULTS_CHANNEL_ID = "1548176572110868551"

# How often the bot looks for new, renamed, moved or cancelled tourneys on the site, in minutes (1–60).
TOURNEY_REFRESH_MINUTES = "5"

# Minutes before the start that the Confirm DMs go out. Unconfirmed players aren't on the list.
CONFIRM_MINUTES = "5"

# How often the live leaderboard (/gr setup leaderboard) updates, in minutes (1–60).
LEADERBOARD_REFRESH_MINUTES = "5"

# The bot token is a secret: `npx wrangler secret put DISCORD_TOKEN`, never here.
