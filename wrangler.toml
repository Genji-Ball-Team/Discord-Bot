name = "genjiball-discord-bot"
main = "src/index.js"
compatibility_date = "2026-09-01"
# The Genji Ball Cloudflare account (same as genjiball.us). Pinned so a deploy can never go to a personal account.
account_id = "c212ad20cc4f4b5382766735f57b91c3"

# Every minute: tournament confirm DMs and lists, and the lobby status. Then, by the minute: every TOURNEY_REFRESH_MINUTES the
# site's new or changed tourneys; every 5 the tournament match results; every LEADERBOARD_REFRESH_MINUTES
# the live leaderboards; every RANK_REFRESH_MINUTES the rank roles (`scheduled` in src/index.js).
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "genjiball-discord-bot"
database_id = "436cac8d-7325-44c7-9d83-cb22cbe17e86"
# The schema: migrations/*.sql, applied by `npm run deploy` (or `npm run db:migrate:remote`).
migrations_dir = "migrations"

# Cloudflare's browser: a picture of each finished tourney's page for TOURNEY_RESULTS_CHANNEL_ID
# (src/screenshot.js). Needs a compatibility_date of 2026-03-24 or later.
[browser]
binding = "BROWSER"

[vars]
# From the Discord Developer Portal, "General Information" page of your app.
DISCORD_APPLICATION_ID = "1556986418239115295"
DISCORD_PUBLIC_KEY = "8d2c76d55758fea1e5f5486946b95ca31783fda2c6348b5d6e3be643c1cab2e2"

# The Genji Ball server: npm run register puts the /gr commands here.
DISCORD_GUILD_ID = "1110543205482627102"

# The website the bot reads. With the SITE_TOKEN secret it also signs players up for its tourneys.
SITE_URL = "https://genjiball.us"
# How long a site request may take, in seconds (1–30), before it counts as the site failing.
# Autocomplete waits at most 2: Discord wants its answer within 3.
SITE_TIMEOUT_SECONDS = "5"

# Staff: members with this role (and server admins) can use everything but /gr stats.
# Right-click the role → Copy Role ID (needs Developer Mode on).
STAFF_ROLE_ID = "1199414765055901737"

# Where the site's tourneys get their sign-up post and list. Right-click the channel → Copy Channel ID.
# Empty: no tourney posts.
TOURNEY_CHANNEL_ID = "1558326695923027998"

# Where tournament match results (wins, kills, rating changes) are posted. Empty: none.
RESULTS_CHANNEL_ID = "1548176572110868551"

# Where each finished tourney is posted: a picture of its page on the site, with the link. Empty: none.
TOURNEY_RESULTS_CHANNEL_ID = "1535559725209616434"

# How often the bot looks for new, renamed, moved or cancelled tourneys on the site, in minutes (1–60).
TOURNEY_REFRESH_MINUTES = "5"

# Minutes before the start that the Confirm DMs go out (1–60). Unconfirmed players aren't on the list.
CONFIRM_MINUTES = "5"

# Where the lobby status is kept: one message, edited every minute, saying whether a ranked lobby is open
# in LOBBY_STATUS_REGION ("eu" or "na") and who is in it (genjiball.us/live). Empty: none.
LOBBY_STATUS_CHANNEL_ID = "1535594980519976960"
LOBBY_STATUS_REGION = "eu"

# How often the live leaderboard (/gr setup leaderboard) updates, in minutes (1–60).
LEADERBOARD_REFRESH_MINUTES = "5"

# Rank roles (/gr link, src/ranks.js): each linked member gets the role of their tier, the higher
# of their EU and NA ones. Tier=role id, lowest tier first, the tiers named as on genjiball.us.
# Empty: no rank roles. The bot's role needs Manage Roles and must be above all of these.
RANK_ROLES = "Rookie=1512569986361589930, Apprentice=1512568373874131005, Master=1512568905141452891, Grandmaster=1512570350150484099, Ascendant=1512569701279072346, Champion=1512569083004977203, Sovereign=1519536470493364254"
# Linked members below the first tier, or not rated yet.
UNRANKED_ROLE_ID = "1535428239051456573"
# The titles (the 1v1 tourney's God and Demigod), region=role id. Staff give these; the bot reads them
# for the site's and /gr leaderboard's lists. Only linked members count.
GOD_ROLE_IDS = "eu=1562890489038897202, na=1562890528922804319"
DEMIGOD_ROLE_IDS = "eu=1562890585021612052, na=1562890626087780473"
# The role God and Demigod show as on the leaderboards, title=role id: one for both regions, only
# shown there. Empty: the title is written out.
LEADERBOARD_TITLE_ROLES = "God=1512571159755886833, Demigod=1512570886811811840"
# Where a climb to a higher tier is posted ("**Name** has ranked up to **Champion** 🏆"). Empty: not posted.
RANKUP_CHANNEL_ID = "1535559725209616434"
# How often the rank roles are checked, in minutes (1–60).
RANK_REFRESH_MINUTES = "5"

# The bot token is a secret: `npx wrangler secret put DISCORD_TOKEN`, never here. So is SITE_TOKEN
# (`npx wrangler secret put SITE_TOKEN`): genjiball.us's BOT_TOKEN, for the tourney sign-ups.
