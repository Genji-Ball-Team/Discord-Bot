name = "genjiball-discord-bot"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Every minute: tourney reminder DMs. Every TOURNEY_REFRESH_MINUTES: tourney posts.
# Every LEADERBOARD_REFRESH_MINUTES: live leaderboards.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "genjiball-discord-bot"
database_id = "436cac8d-7325-44c7-9d83-cb22cbe17e86"

[vars]
# From the Discord Developer Portal, "General Information" page of your app.
DISCORD_APPLICATION_ID = "1556986418239115295"
DISCORD_PUBLIC_KEY = "8d2c76d55758fea1e5f5486946b95ca31783fda2c6348b5d6e3be643c1cab2e2"

# The website the bot reads.
SITE_URL = "https://genjiball.us"

# The "staff" role: members with it (and server admins) can use /setup and /leaderboard.
# Everyone can use /stats. Right-click the role → Copy Role ID.
STAFF_ROLE_ID = "1199414765055901737"

# Where genjiball.us's tourneys are announced. Right-click the channel → Copy Channel ID.
# Leave empty to post none.
TOURNEY_CHANNEL_ID = "1195505822214668328"

# Roles pinged when a tourney is announced. Right-click the role in Discord → Copy Role ID
# (needs Developer Mode on). Leave empty to ping nobody.
EU_ROLE_ID = "1110566266814615584"
NA_ROLE_ID = "1110566315879571517"

# How often the tourney posts are brought up to date (sign-up count, status, standings), in minutes (1–60).
TOURNEY_REFRESH_MINUTES = "5"

# How often the live leaderboard (/setup leaderboard) updates, in minutes (1–60).
LEADERBOARD_REFRESH_MINUTES = "5"

# Minutes before a tourney starts that the "Remind me" DMs go out.
REMINDER_MINUTES = "5"

# The bot token is a secret: set it with `npx wrangler secret put DISCORD_TOKEN`, never here.
